# 工业 AI 员工平台 - 宿主 Nginx 生产配置（TLS 终止 + 反代）
# 部署位置：/www/server/panel/vhost/nginx/industrial-ai.conf （宝塔）或直接 /etc/nginx/conf.d/
# 前置：docker compose 已启动，frontend=127.0.0.1:3000，backend=127.0.0.1:8000
# 域名：app.yourdomain.com（官网/后台）  api.yourdomain.com（API/Webhook）

# ============ 后端 API（FastAPI）============
server {
    listen 80;
    server_name api.yourdomain.com;
    return 301 https://$host$request_uri;   # 强制 HTTPS
}

server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;

    ssl_certificate     /www/server/panel/vhost/cert/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/api.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 50m;   # 营业执照 / 知识文档上传

    # 全部转发到 backend 容器（含 /api /docs /openapi.json /whatsapp/webhook）
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ============ 前端（反代到 frontend 容器，容器内已处理 /api 等）============
server {
    listen 80;
    server_name app.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.yourdomain.com;

    ssl_certificate     /www/server/panel/vhost/cert/app.yourdomain.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/app.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 50m;

    # SPA + 静态资源由 frontend 容器托管，这里只做反代
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
